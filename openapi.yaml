        '400':
          description: Bad Request — Malformed JSON syntax or unsupported Content-Type
          headers:
            X-Request-ID:
              description: Correlation identifier
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                malformed_json_syntax:
                  summary: Syntactically invalid JSON payload
                  value:
                    type: "https://dxora.com/errors/malformed-json"
                    title: "Malformed JSON Request Body"
                    status: 400
                    detail: "The request body could not be parsed as valid JSON. Check for unmatched braces or trailing commas."
