                    code: "ERR_MALFORMED_JSON"
                    invalid_params: []
        '422':
          description: Unprocessable Content — Input validation invariant violations
          headers:
            X-Request-ID:
              description: Correlation identifier
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                character_budget_exceeded:
                  summary: TC-NEG-01 Message exceeds 200 character budget (201 chars)
                  value:
                    type: "https://dxora.com/errors/character-budget-exceeded"
                    title: "Character Budget Exceeded"
                    status: 422
                    detail: "Message length of 201 characters exceeds the maximum allowed budget of 200 characters."
                    instance: "/posting"
                    code: "ERR_CHAR_LIMIT_EXCEEDED"
                    invalid_params:
                      - name: "message"
                        reason: "Character count 201 > 200"
                missing_cta_url:
                  summary: TC-NEG-02 Zero CTA URLs detected in message
                  value:
                    type: "https://dxora.com/errors/missing-cta-url"
                    title: "Missing Call-to-Action URL"
                    status: 422
                    detail: "Message must contain exactly one valid HTTP/HTTPS Call-to-Action link. 0 URLs detected."
                    instance: "/posting"
                    code: "ERR_MISSING_CTA_URL"
                    invalid_params:
                      - name: "message"
                        reason: "Expected exactly 1 URL, found 0"
                multiple_cta_urls:
                  summary: TC-NEG-03 Two or more CTA URLs detected in message
                  value:
                    type: "https://dxora.com/errors/multiple-cta-urls"
                    title: "Multiple Call-to-Action URLs Detected"
                    status: 422
                    detail: "Message contains 2 URLs. Exactly one Call-to-Action URL is permitted per posting request."
                    instance: "/posting"
                    code: "ERR_MULTIPLE_CTA_URLS"
                    invalid_params:
                      - name: "message"
                        reason: "Found 2 URLs: ['https://site-a.com', 'https://site-b.com']"
                bare_domain_no_scheme:
                  summary: TC-NEG-06 Domain without http:// or https:// scheme
                  value:
                    type: "https://dxora.com/errors/invalid-url-scheme"
                    title: "Missing Protocol Scheme"
                    status: 422
                    detail: "Extracted URL 'techdeveloper.io' lacks an explicit scheme. Must begin with http:// or https://."
                    instance: "/posting"
                    code: "ERR_INVALID_URL_SCHEME"
                    invalid_params:
                      - name: "message"
                        reason: "Bare domain rejected; prepend https://"
                empty_whitespace_string:
                  summary: TC-NEG-04 Empty or whitespace-only message
                  value:
                    type: "https://dxora.com/errors/empty-message"
                    title: "Empty Message Body"
                    status: 422
                    detail: "Message cannot be empty or contain only whitespace characters."
                    instance: "/posting"
                    code: "ERR_EMPTY_MESSAGE"
                    invalid_params:
                      - name: "message"
                        reason: "String length after strip must be >= 1"
                missing_required_field:
                  summary: TC-NEG-08 Missing required 'message' attribute
                  value:
                    type: "https://dxora.com/errors/missing-field"
                    title: "Missing Required Payload Field"
                    status: 422
                    detail: "Field 'message' is required in request body."
                    instance: "/posting"
                    code: "ERR_MISSING_FIELD"
                    invalid_params:
                      - name: "message"
                        reason: "Field required"
        '429':
          description: Too Many Requests — Service ingress rate limit triggered
          headers:
            Retry-After:
              description: Recommended wait interval in seconds
              schema:
                type: integer
                example: 60
            X-Request-ID:
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: "https://dxora.com/errors/rate-limit-exceeded"
                title: "Rate Limit Exceeded"
                status: 429
                detail: "Too many posting requests originating from this client IP. Maximum 60 requests per minute."
                instance: "/posting"
                code: "ERR_RATE_LIMITED"
                invalid_params: []
        '500':
          description: Internal Server Error — Uncaught exception with correlation ID
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: "https://dxora.com/errors/internal-server-error"
                title: "Internal Server Error"
                status: 500
                detail: "An unexpected runtime exception occurred. Reference X-Request-ID in log investigations."
                instance: "/posting"
                code: "ERR_INTERNAL_SERVER"
                invalid_params: []
        '504':
          description: Gateway Timeout — Aggregate fan-out exceeded global 10.0s SLA
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: "https://dxora.com/errors/gateway-timeout"
                title: "Gateway Execution Timeout"
                status: 504
                detail: "The aggregate multi-platform posting operation exceeded the 10.0-second gateway budget."
                instance: "/posting"
                code: "ERR_GATEWAY_TIMEOUT"
                invalid_params: []

  /health:
    get:
      summary: Liveness Probe
      description: Returns HTTP 200 if the FastAPI application process and Uvicorn event loop are responsive.
      operationId: checkLiveness
      tags:
        - Health & Probes
      responses:
        '200':
          description: Process is alive and accepting connections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "ok"
                timestamp: "2026-11-18T12:30:15.123456Z"
                version: "1.0.0"

  /ready:
    get:
      summary: Readiness Probe
      description: Returns HTTP 200 with adapter configuration status and connection pool readiness.
      operationId: checkReadiness
      tags:
        - Health & Probes
      responses:
        '200':
          description: Application is fully initialized with platform credentials configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                status: "ready"
                timestamp: "2026-11-18T12:30:15.123456Z"
                version: "1.0.0"
                platforms_configured: 5
                adapters:
                  linkedin: true
                  devto: true
                  hashnode: true
                  mastodon: true
                  telegram: true

components:
  schemas:
    PostingRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 200
          description: >
            The marketing copy to broadcast. Must be between 1 and 200 unicode characters in length
            and contain exactly one valid HTTP or HTTPS Call-to-Action URL.
          example: "Discover modern cloud architectures and automated posting pipelines! https://techdeveloper.io"

    PlatformResult:
      type: object
      required:
        - platform
        - status
        - public_access
        - error
      properties:
        platform:
          type: string
          enum:
            - LinkedIn
            - Dev.to
            - Hashnode
            - Mastodon
            - Telegram
          description: Canonical identifier of the target social or developer platform.
          example: "LinkedIn"
        status:
          type: string
          enum:
            - success
            - failed
          description: Outcome of the posting execution for this specific platform.
          example: "success"
        posted_url:
          type: string
          format: uri
          nullable: true
          description: Publicly accessible URL of the published post, toot, or message if status is success.
          example: "https://www.linkedin.com/feed/update/urn:li:share:7123456789"
        public_access:
          type: boolean
          description: Indicates whether the content is accessible on the open web without authentication.
          example: true
        date:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
          nullable: true
          description: Execution date in ISO-8601 YYYY-MM-DD format (UTC).
          example: "2026-11-18"
        time:
          type: string
          format: time
          pattern: '^\d{2}:\d{2}:\d{2}$'
          nullable: true
          description: Execution time in ISO-8601 HH:MM:SS format (UTC).
          example: "12:30:15"
        latency_ms:
          type: integer
          nullable: true
          description: Upstream platform HTTP round-trip latency in milliseconds.
          example: 1410
        error:
          type: string
          nullable: true
          description: Detailed diagnostic message if posting failed; null if successful.
          example: null

    PostingResponse:
      type: object
      required:
        - success
        - total_platforms
        - successful_posts
        - failed_posts
        - results
      properties:
        success:
          type: boolean
          description: >
            Top-level execution flag. Returns true if at least one platform successfully published;
            false only if all platforms failed or were unconfigured.
          example: true
        total_platforms:
          type: integer
          default: 5
          description: Total count of target platforms evaluated.
          example: 5
        successful_posts:
          type: integer
          minimum: 0
          maximum: 5
          description: Count of platforms where publishing succeeded.
          example: 4
        failed_posts:
          type: integer
          minimum: 0
          maximum: 5
          description: Count of platforms where publishing failed or timed out.
          example: 1
        execution_time_seconds:
          type: number
          format: float
          description: Total wall-clock time elapsed across concurrent fan-out and response normalization.
          example: 1.428
        results:
          type: array
          description: Individual execution outcomes across all 5 platform adapters.
          items:
            $ref: '#/components/schemas/PlatformResult'

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          description: URI reference identifying the specific error category as per RFC 7807.
          example: "https://dxora.com/errors/character-budget-exceeded"
        title:
          type: string
          description: Short, human-readable summary of the problem type.
          example: "Character Budget Exceeded"
        status:
          type: integer
          description: The HTTP status code generated by the origin server.
          example: 422
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence of the problem.
          example: "Message length of 201 characters exceeds the maximum allowed budget of 200 characters."
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying the specific endpoint invocation.
          example: "/posting"
        code:
          type: string
          enum:
            - ERR_CHAR_LIMIT_EXCEEDED
            - ERR_MISSING_CTA_URL
            - ERR_MULTIPLE_CTA_URLS
            - ERR_INVALID_URL_SCHEME
            - ERR_EMPTY_MESSAGE
            - ERR_MISSING_FIELD
            - ERR_MALFORMED_JSON
            - ERR_RATE_LIMITED
            - ERR_GATEWAY_TIMEOUT
            - ERR_INTERNAL_SERVER
          description: Machine-parsable domain error code.
          example: "ERR_CHAR_LIMIT_EXCEEDED"
        invalid_params:
          type: array
          description: Field-level breakdown of parameters that failed validation rules.
          items:
            $ref: '#/components/schemas/InvalidParam'

    InvalidParam:
      type: object
      required:
        - name
        - reason
      properties:
        name:
          type: string
          description: Name of the invalid field or parameter.
          example: "message"
        reason:
          type: string
          description: Specific violation rule.
          example: "Character count 201 exceeds limit of 200"

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          example: "ok"
        timestamp:
          type: string
          format: date-time
          example: "2026-11-18T12:30:15.123456Z"
        version:
          type: string
          example: "1.0.0"

    ReadinessResponse:
      type: object
      required:
        - status
        - timestamp
        - platforms_configured
        - adapters
      properties:
        status:
          type: string
          example: "ready"
        timestamp:
          type: string
          format: date-time
          example: "2026-11-18T12:30:15.123456Z"
        version:
          type: string
          example: "1.0.0"
        platforms_configured:
          type: integer
          example: 5
        adapters:
          type: object
          properties:
            linkedin:
              type: boolean
              example: true
            devto:
              type: boolean
              example: true
            hashnode:
              type: boolean
              example: true
            mastodon:
              type: boolean
              example: true
            telegram:
              type: boolean
              example: true
