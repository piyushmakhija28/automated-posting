openapi: 3.1.0
info:
  title: Automated Multi-Platform Posting Service API
  description: >
    Production-grade asynchronous microservice developed for the Dxora Technologies
    Practical Test assessment. Accepts a validated marketing message (maximum 200 characters,
    containing exactly one Call-to-Action URL) and broadcasts the content concurrently across
    LinkedIn, Dev.to, Hashnode, Mastodon, and Telegram.
    
    Implements the Bulkhead Pattern for fault isolation, dual-tier SLA timeouts (8.0s adapter SLA,
    10.0s gateway SLA), in-memory credential masking, and strict RFC 7807 Problem Details error modeling.
  version: 1.0.0
  contact:
    name: Piyush Makhija
    url: https://github.com/piyushmakhija28/automated-posting
    email: hr@chivoxai.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:4000
    description: Local Development & Verification Server
  - url: https://automated-posting-dxora.onrender.com
    description: Production Live Demo Server (Render.com PaaS)

tags:
  - name: Posting
    description: Multi-platform concurrent broadcast operations and result aggregation
  - name: Health & Probes
    description: Kubernetes/Docker container lifecycle, liveness, and readiness probes

paths:
  /posting:
    post:
      summary: Broadcast message across 5 platforms concurrently
      description: >
        Accepts a promotional message (max 200 unicode characters, exactly 1 CTA link),
        validates input invariants, and executes concurrent asynchronous publishing to
        LinkedIn, Dev.to, Hashnode, Mastodon, and Telegram via non-blocking `httpx.AsyncClient`.
        
        The endpoint guarantees bulkhead fault isolation: upstream platform failures, timeouts,
        or rate limits do not block or fail the entire request, returning itemized telemetry per platform.
      operationId: broadcastPosting
      tags:
        - Posting
      parameters:
        - name: X-Request-ID
          in: header
          required: false
          description: Client-supplied correlation UUID for distributed trace propagation
          schema:
            type: string
            format: uuid
            example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
      requestBody:
        required: true
        description: Inbound posting payload containing the message copy and embedded CTA URL.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostingRequest'
            examples:
              happy_path_standard:
                summary: TC-POS-01 Standard valid message (120 chars)
                value:
                  message: "Discover modern cloud architectures and automated posting pipelines with our service! https://techdeveloper.io"
              boundary_200_chars:
                summary: TC-POS-02 Exact 200-character boundary payload
                value:
                  message: "Scale your engineering velocity today with resilient async event-driven microservices designed for high-throughput enterprise distribution pipelines! Check out our deep-dive at https://techdeveloper.io"
              minimal_valid_message:
                summary: TC-POS-03 Minimal message with shortlink
                value:
                  message: "Check https://a.co"
              url_with_query_params:
                summary: TC-POS-04 Message with complex query parameters
                value:
                  message: "Explore our winter 2026 launch benchmarks! https://techdeveloper.io/benchmarks?source=dxora&campaign=q4&ref=api"
              url_in_parentheses:
                summary: TC-EDG-01 URL enclosed within parentheses
                value:
                  message: "Read our full systems architecture specification (https://techdeveloper.io/spec) for technical deep-dives!"
              url_with_trailing_period:
                summary: TC-EDG-02 URL ending with punctuation
                value:
                  message: "Discover how we built automated broadcasting at scale: https://techdeveloper.io/architecture."
              unicode_and_emojis:
                summary: TC-EDG-03 Unicode characters and multi-byte emojis
                value:
                  message: "🚀 Supercharge your multi-platform distribution! 🌟 High throughput & zero downtime: https://techdeveloper.io 🔥"
      responses:
        '200':
          description: >
            Multi-platform execution outcome. Returned when the request is syntactically valid and
            dispatched across platforms, even if one or more individual platforms encounter upstream errors.
          headers:
            X-Request-ID:
              description: Unique correlation identifier assigned to this request
              schema:
                type: string
                format: uuid
                example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
            X-Process-Time:
              description: Wall-clock execution time in seconds
              schema:
                type: number
                format: float
                example: 1.428
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingResponse'
              examples:
                all_platforms_success:
                  summary: 100% Happy Path (All 5 platforms succeeded)
                  value:
                    success: true
                    total_platforms: 5
                    successful_posts: 5
                    failed_posts: 0
                    execution_time_seconds: 1.42
                    results:
                      - platform: "LinkedIn"
                        status: "success"
                        posted_url: "https://www.linkedin.com/feed/update/urn:li:share:7123456789"
                        public_access: true
                        date: "2026-11-18"
                        time: "12:30:15"
                        latency_ms: 1410
                        error: null
                      - platform: "Dev.to"
                        status: "success"
